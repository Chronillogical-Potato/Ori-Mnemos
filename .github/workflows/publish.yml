name: Stage npm release

# Push a version bump to main and this stages it on npm. Nothing goes live
# until you press Approve on npmjs.com -> Staged Packages (2FA).
# Can also be run by hand: Actions -> "Stage npm release" -> Run workflow.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. One-time setup on
# npmjs.com -> ori-memory -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner aayoawoyemi, repository Ori-Mnemos, workflow publish.yml,
#   with "stage publish" allowed.

on:
  push:
    branches: ["main"]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  stage:
    if: github.ref == 'refs/heads/main' && github.repository == 'aayoawoyemi/Ori-Mnemos'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 22, not 24: better-sqlite3 has no prebuilt binary for 24 on CI.
          # Staged publishing needs Node >= 22.14.
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Staged publishing needs npm >= 11.15.0.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Is this version new?
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Compare output, not exit code: npm versions disagree on whether a
          # missing version is an error.
          if [ "$(npm view "ori-memory@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "ori-memory@$VERSION is already published; nothing to stage."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        if: steps.v.outputs.new == 'true'
        run: npm ci

      - name: Cache Embedding Model
        if: steps.v.outputs.new == 'true'
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Prefetch Embedding Model
        if: steps.v.outputs.new == 'true'
        run: node scripts/prefetch-model.mjs

      - name: Test
        if: steps.v.outputs.new == 'true'
        run: npm test

      # Same gates as prepublishOnly: changelog, lint, build, bin smoke test.
      - name: Pre-publish checks
        if: steps.v.outputs.new == 'true'
        run: node scripts/check-changelog.mjs && npm run lint && npm run build && npm run smoke:bin

      - name: Stage on npm
        if: steps.v.outputs.new == 'true'
        run: npm stage publish --provenance

      - name: Next step
        if: steps.v.outputs.new == 'true'
        run: |
          {
            echo "### ori-memory@${{ steps.v.outputs.version }} is staged"
            echo "Approve it at https://www.npmjs.com → your avatar → **Staged Packages** → **Approve**."
            echo
            echo "Release notes:"
            echo
            node scripts/release-notes.mjs "${{ steps.v.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"
