name: Publish to npm

# One button: Actions -> "Publish to npm" -> Run workflow.
# Publishes whatever version is in package.json on main, then tags it and
# creates a GitHub release from the matching CHANGELOG section.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. One-time setup on
# npmjs.com -> ori-memory -> Settings -> Trusted Publisher -> GitHub Actions:
#   owner aayoawoyemi, repository Ori-Mnemos, workflow publish.yml

on:
  workflow_dispatch:

permissions:
  contents: write # tag + GitHub release
  id-token: write # npm trusted publishing + provenance

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Trusted publishing needs npm >= 11.5.1; Node 24 ships it.
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse a version that is already published
        run: |
          # Compare output, not exit code: npm versions disagree on whether a
          # missing version is an error.
          if [ "$(npm view "ori-memory@${{ steps.v.outputs.version }}" version 2>/dev/null)" = "${{ steps.v.outputs.version }}" ]; then
            echo "::error::ori-memory@${{ steps.v.outputs.version }} is already on npm. Bump package.json first."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Cache Embedding Model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-${{ runner.os }}-all-MiniLM-L6-v2

      - name: Prefetch Embedding Model
        run: node scripts/prefetch-model.mjs

      - name: Test
        run: npm test

      # prepublishOnly runs the changelog check, lint, build and bin smoke test.
      - name: Publish
        run: npm publish --provenance --access public

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          node scripts/release-notes.mjs "$VERSION" > RELEASE_NOTES.md
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --title "v$VERSION" --notes-file RELEASE_NOTES.md
